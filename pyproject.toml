[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-gpt"
version = "0.1.0"
description = "A readable, reproducible GPT training stack for one NVIDIA DGX Spark"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "cuber-1" }]
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
]

[project.optional-dependencies]
data = ["datasets>=4", "huggingface-hub>=0.30", "sentencepiece>=0.2"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
spark-gpt = "sparkgpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: tests that require a CUDA GPU"]
