# 7,986,253,824 parameters. Sizing/sanity only, not a one-week scratch recipe.
[model]
vocab_size = 32768
context_length = 2048
n_layer = 36
n_head = 32
n_kv_head = 8
n_embd = 4096
intermediate_size = 14336
dropout = 0.0
rope_theta = 10000.0
norm_eps = 1e-5
bias = false
tie_embeddings = true

[training]
data_dir = "data/fineweb_edu"
out_dir = "runs/spark-8b-sanity"
seed = 1337
device = "cuda"
dtype = "bfloat16"
compile = false
batch_size = 1
gradient_accumulation_steps = 1
max_steps = 1
learning_rate = 0.0001
min_lr = 0.00001
warmup_steps = 0
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
eval_interval = 1
eval_batches = 1
log_interval = 1
checkpoint_interval = 1
