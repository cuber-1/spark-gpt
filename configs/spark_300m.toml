# 304,137,216 parameters: the one-week from-scratch training target.
[model]
vocab_size = 32768
context_length = 2048
n_layer = 24
n_head = 16
n_kv_head = 4
n_embd = 1024
intermediate_size = 2816
dropout = 0.0
rope_theta = 10000.0
norm_eps = 1e-5
bias = false
tie_embeddings = true

[training]
data_dir = "data/fineweb_edu"
out_dir = "runs/spark-300m"
seed = 1337
device = "cuda"
dtype = "bfloat16"
compile = true
batch_size = 8
gradient_accumulation_steps = 16
max_steps = 17166
learning_rate = 0.0003
min_lr = 0.00003
warmup_steps = 172
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
eval_interval = 250
eval_batches = 20
log_interval = 1
checkpoint_interval = 250
